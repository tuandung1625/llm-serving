services:
  model:
    image: vllm/vllm-openai:nightly
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768
      - --max-num-seqs=32
      - --max-num-batched-tokens=12288
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill
      - --async-scheduling
      - --performance-mode=interactivity
      - --prefix-caching-hash-algo=sha256
      # Last-resort only. CPU/RAM are tiny in official env, so this may hurt ERS.
      - --kv-offloading-size=2
      - --kv-offloading-backend=native
      # - --kv-offloading-size=1
      # - --kv-offloading-size=4
      - --no-enable-log-requests
      - --disable-log-stats
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

