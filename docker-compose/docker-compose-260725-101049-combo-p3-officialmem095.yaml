services:
  model:
    image: vllm/vllm-openai:nightly
    entrypoint: [python3, -m, vllm.entrypoints.openai.api_server]
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000

      # Combo candidate C4:
      # Current best P3 branch with official-style 0.95 GPU utilization.
      # On RTX 4090 this is not memory-realistic for H200 MIG; run it to
      # estimate upside, then validate under an 18GB/MIG-like budget if possible.
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=auto

      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.95
      - --max-model-len=32768
      - --max-num-seqs=32
      - --max-num-batched-tokens=12288

      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill

      - --async-scheduling
      - --performance-mode=interactivity
      - --prefix-caching-hash-algo=sha256
      - --no-enable-log-requests
      - --disable-log-stats
    environment: {OMP_NUM_THREADS: "1", MKL_NUM_THREADS: "1", TOKENIZERS_PARALLELISM: "false", PYTHONUNBUFFERED: "1"}
    ports: ["8000:8000"]
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
