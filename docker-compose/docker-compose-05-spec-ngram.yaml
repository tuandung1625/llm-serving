services:
  model:
    image: vllm/vllm-openai:nightly

    entrypoint:
      - python3 # Don't change this to vllm-server
      - -m # Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server # Don't change this to vllm-server

    command:
      - --model=/model # Don't change this
      - --served-model-name=LFM2.5-1.2B-Instruct # Don't change this
      - --host=0.0.0.0 # Don't change this
      - --port=8000 # Don't change this

      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=fp8

      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768

      - --max-num-seqs=32
      - --max-num-batched-tokens=12288

      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill

      - --async-scheduling
      - --performance-mode=interactivity
      - --prefix-caching-hash-algo=sha256

      # N-gram speculative decoding, no draft model.
      # Good candidate for multi-turn traces with repeated prompt/history text.
      - --speculative-config={"method":"ngram","num_speculative_tokens":4,"prompt_lookup_min":2,"prompt_lookup_max":5}
      # Alternatives:
      # - --speculative-config={"method":"ngram","num_speculative_tokens":2,"prompt_lookup_min":2,"prompt_lookup_max":4}
      # - --speculative-config={"method":"ngram","num_speculative_tokens":6,"prompt_lookup_min":3,"prompt_lookup_max":8}
      # - --speculative-config={"method":"suffix","num_speculative_tokens":4}

      - --no-enable-log-requests
      - --disable-log-stats

    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

