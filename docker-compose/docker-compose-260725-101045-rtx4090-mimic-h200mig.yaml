services:
  model:
    image: vllm/vllm-openai:nightly

    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server

    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000

      # Local RTX 4090 has 24GB VRAM. Official H200 MIG has about 18GB.
      # 0.71 * 24GB ~= 17.0GB, close to 0.95 * 18GB ~= 17.1GB.
      # Use this file for realistic local memory pressure on your rented 4090.
      - --gpu-memory-utilization=0.71

      - --dtype=bfloat16
      - --kv-cache-dtype=auto
      - --tensor-parallel-size=1
      - --max-model-len=32768
      - --max-num-seqs=32
      - --max-num-batched-tokens=4096

      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill

      - --async-scheduling
      - --performance-mode=balanced

      - --prefix-caching-hash-algo=sha256
      - --no-enable-log-requests

      # Keep stats enabled in this realistic local file so you can see
      # preemption/KV/prefix-cache behavior while tuning.
      # Add --disable-log-stats only for final submission-style runs.

    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

    ports:
      - "8000:8000"

    volumes:
      - ../model:/model:ro

    shm_size: "2g"
    cpus: 3.0
    mem_limit: 8g
    memswap_limit: 8g

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
