services:
  model:
    image: vllm/vllm-openai:nightly
    entrypoint: [python3, -m, vllm.entrypoints.openai.api_server]
    command:
      # Level4 E1: gpu_memory_utilization=0.92, max_model_len=32768.
      # Memory sweep with current best scheduler and stream_interval=1.
      # E6 uses golden trace max plus margin; do not use it if an official trace can exceed this length.
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=auto
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768
      - --max-num-seqs=32
      - --max-num-batched-tokens=12288
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill
      - --async-scheduling
      - --performance-mode=interactivity
      - --prefix-caching-hash-algo=sha256
      - --block-size=128
      - --mamba-block-size=256
      - --prefix-match-unit=128
      - --stream-interval=1
      - --no-enable-log-requests
      - --disable-log-stats
    environment: {OMP_NUM_THREADS: "1", MKL_NUM_THREADS: "1", TOKENIZERS_PARALLELISM: "false", PYTHONUNBUFFERED: "1"}
    ports: ["8000:8000"]
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
