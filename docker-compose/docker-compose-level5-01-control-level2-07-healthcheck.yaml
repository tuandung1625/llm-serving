services:
  model:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly}
    entrypoint: [python3, -m, vllm.entrypoints.openai.api_server]
    command:
      # Level5 01: control level2-07 plus healthcheck/offline env.
      # Use this as the official-score control for Level5.
      # Same serving flags as level2-07; only health/readiness and offline env are added.
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=auto
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768
      - --max-num-seqs=32
      - --max-num-batched-tokens=12288
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --mamba-cache-dtype=auto
      - --enable-chunked-prefill
      - --async-scheduling
      - --performance-mode=interactivity
      - --prefix-caching-hash-algo=sha256
      - --block-size=128
      - --mamba-block-size=256
      - --prefix-match-unit=128
      - --stream-interval=2
      - --no-enable-log-requests
      - --disable-log-stats
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      VLLM_USAGE_STATS: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports: ["8000:8000"]
    shm_size: "2g"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
